<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>VoxAI Studio 2.5</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #0f0f18;
            --accent: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .title-bar {
            height: 40px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            -webkit-app-region: drag;
        }

        .title-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .language-switch {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
        }

        .lang-btn {
            min-width: 36px;
            height: 26px;
            padding: 0 10px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
        }

        .quit-btn,
        .min-btn {
            height: 28px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .min-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .quit-btn:hover {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .title-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .title-logo svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        .title-logo span {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .shell {
            height: calc(100% - 40px);
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 42%),
                radial-gradient(circle at 70% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 42%),
                var(--bg-primary);
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            padding: 24px;
        }

        .loading-icon {
            width: 42px;
            height: 42px;
            color: var(--accent);
            animation: float 2s ease-in-out infinite;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(148, 163, 184, 0.25);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .title {
            font-size: 23px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .hint {
            font-size: 13px;
            color: #64748b;
            max-width: 440px;
            line-height: 1.5;
        }

        .progress {
            width: 320px;
            max-width: 72vw;
            height: 6px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.2);
            overflow: hidden;
            margin-top: 6px;
        }

        .progress::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: inherit;
            animation: indeterminate 1.4s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(280%);
            }
        }
    </style>
</head>

<body>
    <div class="title-bar">
        <div class="title-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            <span>VoxAI Studio</span>
        </div>
        <div class="title-actions">
            <div class="language-switch">
                <button type="button" class="lang-btn" data-ui-lang="en" id="btnLangEn">EN</button>
                <button type="button" class="lang-btn" data-ui-lang="zh" id="btnLangZh">中</button>
            </div>
            <button type="button" class="min-btn" id="btnMinimize">Minimize</button>
            <button type="button" class="quit-btn" id="btnQuit">Quit</button>
        </div>
    </div>

    <main class="shell">
        <div class="loading-content">
            <svg class="loading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            <div class="spinner"></div>
            <h1 class="title" id="loadingTitle">Initializing VoxAI Studio</h1>
            <p class="subtitle" id="loadingSubtitle">Connecting to server...</p>
            <p class="hint" id="loadingHint">Usually about 1 minute after the first launch. First start or missing cache can take 2–5 minutes. Closing to tray keeps the model loaded; a full quit reloads it.</p>
            <div class="progress"></div>
        </div>
    </main>
    <script>
        (function () {
            var t = {
                en: {
                    title: 'Initializing VoxAI Studio',
                    subtitle: 'Connecting to server...',
                    hint: 'Usually about 1 minute after the first launch. First start or missing cache can take 2–5 minutes. Closing to tray keeps the model loaded; a full quit reloads it.',
                    minimize: 'Minimize',
                    quit: 'Quit'
                },
                zh: {
                    title: 'VoxAI Studio 初始化中',
                    subtitle: '正在连接服务器...',
                    hint: '首次之后通常约 1 分钟。首次启动或缓存未齐时可能需要 2–5 分钟。缩到托盘不会重新加载；完整退出后再开才会。',
                    minimize: '最小化',
                    quit: '退出'
                }
            };

            function applyLang(lang) {
                if (lang !== 'zh' && lang !== 'en') lang = 'en';
                localStorage.setItem('indextts_lang', lang);
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
                document.getElementById('loadingTitle').textContent = t[lang].title;
                document.getElementById('loadingSubtitle').textContent = t[lang].subtitle;
                document.getElementById('loadingHint').textContent = t[lang].hint;
                document.getElementById('btnMinimize').textContent = t[lang].minimize;
                document.getElementById('btnQuit').textContent = t[lang].quit;
                document.querySelectorAll('.lang-btn').forEach(function (btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-ui-lang') === lang);
                });
                if (window.electronAPI && typeof window.electronAPI.setLang === 'function') {
                    window.electronAPI.setLang(lang);
                }
            }

            document.querySelectorAll('.lang-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    applyLang(btn.getAttribute('data-ui-lang'));
                });
            });
            document.getElementById('btnMinimize').addEventListener('click', function () {
                if (window.electronAPI && typeof window.electronAPI.minimize === 'function') {
                    window.electronAPI.minimize();
                }
            });
            document.getElementById('btnQuit').addEventListener('click', function () {
                if (window.electronAPI && typeof window.electronAPI.quit === 'function') {
                    window.electronAPI.quit();
                    return;
                }
                window.close();
            });

            applyLang(localStorage.getItem('indextts_lang') || 'en');
        })();
    </script>
</body>

</html>
