<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VoxAI Waveform Debug</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <style>
        body {
            margin: 0;
            background: var(--color-bg-primary);
            color: var(--text-primary);
        }
        .waveform-root {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px 24px;
            box-sizing: border-box;
            gap: 16px;
        }
        .waveform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .waveform-header h1 {
            font-size: var(--font-size-lg);
            margin: 0;
        }
        .waveform-main {
            flex: 1;
            border-radius: var(--border-radius-lg);
            background: rgba(15, 15, 24, 0.9);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            position: relative;
        }
        #waveformCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loadingText {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: var(--font-size-sm);
            pointer-events: none;
        }
        .waveform-footer {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
        }
        .btn-close {
            padding: 6px 10px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-secondary);
            cursor: pointer;
        }
        .btn-close:hover {
            background: var(--glass-bg-hover);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="waveform-root">
        <div class="waveform-header">
            <h1>Waveform Debug</h1>
            <button class="btn-close" id="btnClose">Close</button>
        </div>
        <div class="waveform-main">
            <canvas id="waveformCanvas"></canvas>
            <div id="loadingText">Loading audio...</div>
        </div>
        <div class="waveform-footer">
            This window is only for debugging waveform rendering and does not affect the main UI.
        </div>
    </div>
    <script src="js/audio.js"></script>
    <script src="js/waveform_window.js"></script>
</body>
</html>
